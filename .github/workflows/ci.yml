name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Migration sanity
        run: |
          BMS_DATABASE_URL=sqlite+aiosqlite:///./ci.db alembic upgrade head
          BMS_DATABASE_URL=sqlite+aiosqlite:///./ci.db alembic downgrade base
