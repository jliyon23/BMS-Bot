[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmsbot"
version = "0.1.0"
description = "BookMyShow watchlist monitor, Telegram alerts, proxy pool and admin dashboard"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bmsbot = "bmsbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmsbot = ["admin/templates/*.html", "admin/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends() belongs in defaults by design.
# SIM105: the explicit try/except keeps the worker loops easy to read.
ignore = ["E501", "B008", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
