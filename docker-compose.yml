x-app: &app
  build: .
  image: bmsbot:local
  env_file:
    - .env
  environment:
    BMS_ENV: ${BMS_ENV:-dev}
    BMS_DATABASE_URL: sqlite+aiosqlite:////data/bmsbot.db
    BMS_DATA_DIR: /data
  user: "${BMS_UID:-1000}:${BMS_GID:-1000}"
  volumes:
    - ./data:/data
  restart: unless-stopped
  stop_grace_period: 20s

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  bot:
    <<: *app
    command: ["bmsbot", "run-bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  monitor:
    <<: *app
    command: ["bmsbot", "run-monitor"]
    environment:
      BMS_ENV: ${BMS_ENV:-dev}
      BMS_DATABASE_URL: sqlite+aiosqlite:////data/bmsbot.db
      BMS_DATA_DIR: /data
      BMS_WORKER_ID: monitor-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    <<: *app
    command: ["bmsbot", "run-proxy"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  alerts:
    <<: *app
    command: ["bmsbot", "run-alerts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    <<: *app
    command: ["bmsbot", "run-admin", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
